# =============================================================================
# Workflow CI/CD, Construction et publication de l'image Docker sur GHCR.
#
# Déclencheurs :
#   - push sur la branche main  -> construction + publication sur GHCR ;
#   - pull request vers main     -> construction de validation (sans push) ;
#   - déclenchement manuel.
#
# L'authentification au registre utilise le GITHUB_TOKEN fourni
# automatiquement par GitHub Actions, avec la permission packages: write.
# =============================================================================

name: Build & Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Permissions minimales nécessaires à la publication sur GHCR.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Annule les exécutions précédentes encore en cours sur la même référence.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Construire et publier
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Connexion au registre uniquement hors pull request
      # (les PR issues de forks n'ont pas de droits d'écriture).
      - name: Connexion à GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcul des métadonnées (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construction et publication
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # On ne publie pas lors des pull requests : construction de validation.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
