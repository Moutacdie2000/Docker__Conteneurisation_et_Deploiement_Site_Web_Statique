# =============================================================================
# Docker Compose, Orchestration locale du site statique.
#
# Usage :
#   docker compose up --build      # construit l'image et démarre le service
#   docker compose up -d           # démarre en arrière-plan
#   docker compose down            # arrête et supprime le conteneur
#
# Le site est ensuite accessible sur http://localhost:8088
# =============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: docker-static-site:latest
    container_name: docker-static-site
    ports:
      # Hôte 8088 -> conteneur 8080 (port applicatif non privilégié de Nginx).
      - "8088:8080"
    restart: unless-stopped

    # Le conteneur s'exécute déjà sous l'utilisateur « nginx » (non root).
    # On renforce encore le profil de sécurité au niveau de l'exécution.
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Reprise du HEALTHCHECK défini dans le Dockerfile, explicité ici pour
    # que `docker compose ps` affiche l'état de santé du service.
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider",
         "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
