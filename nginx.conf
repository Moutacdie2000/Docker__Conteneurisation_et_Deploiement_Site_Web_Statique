# =============================================================================
# Configuration Nginx pour le site statique conteneurisé.
#
# Objectifs :
#   - servir les fichiers statiques de /usr/share/nginx/html ;
#   - activer la compression gzip ;
#   - appliquer une stratégie de cache HTTP adaptée ;
#   - durcir la diffusion avec des en-têtes de sécurité ;
#   - exposer un point d'entrée /healthz pour le HEALTHCHECK Docker.
#
# Cette configuration est conçue pour fonctionner sous un utilisateur
# non privilégié (image nginx:alpine, utilisateur « nginx »), c'est
# pourquoi elle écoute sur le port 8080 plutôt que sur le port 80.
# =============================================================================

worker_processes auto;

# Le PID est écrit dans /tmp afin d'être accessible en écriture par un
# utilisateur non root.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Journalisation ------------------------------------------------------
    # Les logs sont redirigés vers la sortie standard / d'erreur du conteneur,
    # conformément aux bonnes pratiques des conteneurs (logs collectés par le
    # moteur Docker).
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # --- Répertoires temporaires accessibles à l'utilisateur non root --------
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # --- Réglages de transfert ----------------------------------------------
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;

    # --- Compression gzip ----------------------------------------------------
    gzip               on;
    gzip_vary          on;
    gzip_comp_level    6;
    gzip_min_length    256;
    gzip_proxied       any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf;

    server {
        # Port non privilégié : autorise l'exécution sans droits root.
        listen       8080;
        listen       [::]:8080;
        server_name  _;

        root  /usr/share/nginx/html;
        index index.html;

        # --- En-têtes de sécurité (appliqués à toutes les réponses) ----------
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        # CSP volontairement stricte : tout provient de la même origine.
        # 'unsafe-inline' pour les styles couvre le favicon en SVG embarqué.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'" always;

        # --- Point de contrôle de santé pour le HEALTHCHECK Docker -----------
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # --- Cache long pour les ressources statiques versionnables ----------
        location ~* \.(?:css|js|svg|ico|png|jpe?g|gif|webp|woff2?|ttf|otf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # --- Pas de mise en cache du HTML (toujours frais) -------------------
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }

        # --- Pages d'erreur --------------------------------------------------
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
        }
    }
}
